const kb={u:0,d:0,l:0,r:0},tc={gas:0,brk:0,l:0,r:0,w:0,tl:0};
const KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
addEventListener('keydown',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k)kb[k]=1;if(e.key==='e')shift(1);if(e.key==='q')shift(-1)});
addEventListener('keyup',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k)kb[k]=0});
function pad(el,f){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);f(1)});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,()=>f(0)))}
addEventListener('blur',()=>{kb.u=kb.d=kb.l=kb.r=0;tc.gas=tc.brk=tc.l=tc.r=0});
pad($('gas'),v=>tc.gas=v);pad($('brk'),v=>tc.brk=v);pad($('bl'),v=>tc.l=v);pad($('br'),v=>tc.r=v);
$('gu').onpointerdown=()=>shift(1);$('gd').onpointerdown=()=>shift(-1);
const wh=$('whl');let wd=0;const wm=e=>{const r=wh.getBoundingClientRect(),a=cl(Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2)),-1.3,1.3);tc.w=cl(a/1.0,-1,1);wh.style.transform=`rotate(${a}rad)`};
wh.addEventListener('pointerdown',e=>{wh.setPointerCapture(e.pointerId);wd=1;wm(e)});wh.addEventListener('pointermove',e=>wd&&wm(e));
['pointerup','pointercancel'].forEach(v=>wh.addEventListener(v,()=>{wd=0;tc.w=0;wh.style.transform=''}));
addEventListener('deviceorientation',e=>{const a=screen.orientation?screen.orientation.angle:(window.orientation||0);let v=a===90?e.beta:a===270||a===-90?-e.beta:e.gamma;tc.tl=cl((S.inv?-1:1)*(v||0)/25,-1,1)});
function shift(d){if(S.auto||phase!=='race'||!me)return;me.g=cl(me.g+d,1,5)}

/* ---------- audio ---------- */
let AC,osc,gain;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();osc=AC.createOscillator();osc.type='sawtooth';gain=AC.createGain();gain.gain.value=0;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=800;osc.connect(f);f.connect(gain);gain.connect(AC.destination);osc.start()}catch(e){}}
function beep(f,d){if(!AC||!S.snd)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}
addEventListener('pointerdown',audio);addEventListener('keydown',audio);

/* ---------- settings ---------- */
function setUI(){document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('pri',b.dataset.c===S.ctl));
 $('ta').textContent='Gearbox: '+(S.auto?'Automatic':'Manual');$('ta').classList.toggle('pri',S.auto);$('ts').textContent='Sound: '+(S.snd?'On':'Off');$('ts').classList.toggle('pri',S.snd);$('ti').textContent='Invert tilt: '+(S.inv?'On':'Off');
 $('bl').parentNode.style.display=S.ctl==='arrows'?'flex':'none';wh.style.display=S.ctl==='wheel'?'block':'none';$('gb').style.display=S.auto?'none':'flex';save()}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.ctl=b.dataset.c;if(S.ctl==='tilt'&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission();setUI()});
$('ta').onclick=()=>{S.auto=!S.auto;setUI()};$('ts').onclick=()=>{S.snd=!S.snd;setUI()};$('ti').onclick=()=>{S.inv=!S.inv;setUI()};
$('op').onclick=$('ls').onclick=$('hs').onclick=()=>$('set').classList.add('on');$('sx').onclick=()=>$('set').classList.remove('on');setUI();
$('nm').value=localStorage.rn||'';const nm=()=>{const n=esc($('nm').value.trim())||'Racer'+(Math.random()*90+10|0);localStorage.rn=n;return n};

/* ---------- rooms ---------- */
$('mk').onclick=async()=>{if(!uid)return toast('Signing in, try again');const c=Math.random().toString(36).slice(2,6).toUpperCase(),r=db.ref(`rooms/${c}/meta`);
 try{await r.set({host:uid,max:4,laps:3,track:0,state:'lobby'})}catch(e){return toast('Could not create room: '+(e.code||e.message))}
 r.onDisconnect().remove();enter(c,true)};
$('jn').onclick=async()=>{if(!uid)return toast('Signing in, try again');const c=$('jc').value.trim().toUpperCase();if(c.length!==4)return toast('Enter the 4-letter room code');
 try{const s=await db.ref(`rooms/${c}/meta`).once('value');if(!s.exists())return toast('Room not found');if(s.val().state!=='lobby')return toast('Race already started');await enter(c,false)}catch(e){toast('Join failed: '+(e.code||e.message))}};
async function enter(c,h){
 code=c;isHost=h;const pr=db.ref(`rooms/${c}/players/${uid}`);
 if(!h){const[ps,mx]=await Promise.all([db.ref(`rooms/${c}/players`).once('value'),db.ref(`rooms/${c}/meta/max`).once('value')]);if(ps.numChildren()>=mx.val())return toast('Room is full')}
 try{await pr.set({name:nm(),car:+$('cs').value})}catch(e){return toast('Could not join: '+(e.code||e.message))}
 pr.onDisconnect().remove();myPos=db.ref(`rooms/${c}/pos/${uid}`);myPos.onDisconnect().remove();
 const m=db.ref(`rooms/${c}/meta`),p=db.ref(`rooms/${c}/players`),q=db.ref(`rooms/${c}/pos`);refs=[m,p,q];
 m.on('value',s=>{meta=s.val();if(!meta)return leave('Host left, room closed');lobbyUI();
  if(meta.state==='race'&&phase==='lobby')startRace();else if(meta.state==='lobby'&&(phase==='count'||phase==='race'))toLobby()});
 p.on('value',s=>{players=s.val()||{};lobbyUI()});q.on('value',s=>pos=s.val()||{});
 phase='lobby';show('lobby')}
const ids=()=>Object.keys(players).sort();
function lobbyUI(){if(!meta)return;$('rc').textContent=code;const a=ids();
 $('pl').innerHTML=a.map((k,i)=>`<div class="row"><i style="background:${hx(COL[i%12])}"></i>${esc(players[k].name)}${k===meta.host?' 👑':''}${k===uid?' (you)':''}<span>${(CARS[players[k].car]||CARS[0]).n}</span></div>`).join('');
 $('cnt').textContent=a.length+'/'+meta.max;
 for(const[i,v]of[['mx',meta.max],['lp',meta.laps],['tk',meta.track]]){if(document.activeElement!==$(i))$(i).value=v;$(i).disabled=!isHost}
 const full=a.length>=meta.max;$('go').style.display=isHost?'':'none';$('go').disabled=!full;$('go').textContent=full?'Start race':`Waiting for players (${a.length}/${meta.max})`}
$('mx').onchange=()=>isHost&&db.ref(`rooms/${code}/meta/max`).set(cl(+$('mx').value||4,2,12));
$('lp').onchange=()=>isHost&&db.ref(`rooms/${code}/meta/laps`).set(cl(+$('lp').value||3,1,15));
$('tk').onchange=()=>isHost&&db.ref(`rooms/${code}/meta/track`).set(+$('tk').value);
$('cs').onchange=()=>{S.car=+$('cs').value;save();code&&db.ref(`rooms/${code}/players/${uid}/car`).set(S.car)};
$('go').onclick=()=>meta&&meta.state==='lobby'&&ids().length>=meta.max&&db.ref(`rooms/${code}/meta`).update({state:'race',startAt:now()+6000});
$('nx').onclick=()=>db.ref(`rooms/${code}/meta`).update({state:'lobby'});
function leave(msg){refs.forEach(r=>r.off());refs=[];if(code){db.ref(`rooms/${code}/players/${uid}`).remove();myPos&&myPos.remove();if(isHost)db.ref(`rooms/${code}/meta`).remove()}
 clearScene();phase='menu';code=null;meta=null;$('hud').classList.remove('on');show('menu');msg&&toast(msg)}
$('lv').onclick=$('lv2').onclick=()=>leave();
function copy(t,m){const done=()=>toast(m);function fb(){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();i.setSelectionRange(0,99);try{document.execCommand('copy');done()}catch(e){toast('Code: '+t)}i.remove()}
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
$('cc').onclick=()=>copy(code,'Code copied');$('cl').onclick=()=>copy(location.origin+location.pathname+'?room='+code,'Invite link copied');
const qr=new URLSearchParams(location.search).get('room');if(qr)$('jc').value=qr.toUpperCase().slice(0,4);
function clearScene(){if(mine){sc.remove(mine);mine=null}for(const k in rem)sc.remove(rem[k].g);rem={};me=null;if(gain)gain.gain.value=0}
function toLobby(){clearScene();myPos&&myPos.remove();phase='lobby';$('hud').classList.remove('on');show('lobby')}

/* ---------- race ---------- */
function startRace(){
 buildTrack(meta.track);LAPS=meta.laps;const s=Math.max(0,ids().indexOf(uid)),i=N-8-s*3,p=TR.p[i],n=TR.n[i],t=TR.t[i],o=(s%2?-1:1)*3.2;
 me={x:p.x+n.x*o,z:p.z+n.z*o,h:Math.atan2(t.x,t.z),v:0,g:1,i,pi:i,l:0,p:i,fin:0,rpm:.2,y:0,vy:0};
 mine=mkCar(players[uid]?+players[uid].car:0,COL[s%12]);sc.add(mine);cdv=0;
 cam.position.set(me.x-Math.sin(me.h)*9,4.5,me.z-Math.cos(me.h)*9);
 phase='count';show('');$('hud').classList.add('on');setUI();$('cd').textContent=''}
function drive(dt){
 const m=me;let t=kb.u||tc.gas?1:0,b=kb.d||tc.brk?1:0,s=cl(kb.r-kb.l+tc.r-tc.l+(S.ctl==='wheel'?tc.w:0)+(S.ctl==='tilt'?tc.tl:0),-1,1);
 if(m.fin){t=0;b=.6}
 if(S.auto){if(m.v>GM[m.g]*.96&&m.g<5)m.g++;else if(m.g>1&&m.v<GM[m.g-1]*.8)m.g--}
 const gm=GM[m.g];
 if(t){if(m.v<0)m.v+=90*dt;else if(m.v<gm){let a=AG[m.g]*cl((gm-m.v)/(gm*.05),0,1);if(m.g>1&&m.v<GM[m.g-1]*.6)a*=.5;m.v+=a*dt}}
 if(m.v>gm+2)m.v-=25*dt;
 if(b){if(m.v>.5)m.v-=70*dt*b;else if(!t&&!m.fin)m.v=Math.max(m.v-20*dt,-20)}
 m.v-=m.v*.03*dt;
 const d=near(m.x,m.z,m.i);m.pi=m.i;m.i=d[0];
 if(d[1]>W/2+1)m.v-=m.v*1.5*dt;
 if(d[1]>W/2+9){const p=TR.p[m.i];m.x+=(p.x-m.x)*.08;m.z+=(p.z-m.z)*.08;m.v*=.97}
 let k0=-1;RP.forEach(r=>{const k=(m.i-r.i+N)%N;if(k*sp<=9.5&&d[1]<W/2-1)k0=k*sp});
 if(!m.vy){m.y=k0>=0?1.5*Math.min(k0,9)/9:0;if(k0>=8&&m.v>25)m.vy=m.v/3.6*.18}
 else{m.vy-=20*dt;m.y+=m.vy*dt;if(m.y<=0){m.y=0;m.vy=0}}
 m.h-=s*1.9*Math.min(1,Math.abs(m.v)/20)/(1+Math.abs(m.v)/150)*(m.v<0?-1:1)*dt;
 m.x+=Math.sin(m.h)*m.v/3.6*dt;m.z+=Math.cos(m.h)*m.v/3.6*dt;
 for(const k in rem){const r=rem[k],dx=m.x-r.x,dz=m.z-r.z,q=dx*dx+dz*dz;if(q<7&&q>.001){const l=Math.sqrt(q),p=(2.65-l)*.6;m.x+=dx/l*p;m.z+=dz/l*p;m.v*=.985}}
 if(m.pi>N*.8&&m.i<N*.2)m.l++;else if(m.pi<N*.2&&m.i>N*.8)m.l--;
 m.p=m.l*N+m.i;m.rpm=cl(Math.abs(m.v)/GM[m.g],.15,1);
 if(m.l>LAPS&&!m.fin){m.fin=+((now()-meta.startAt)/1000).toFixed(2);beep(660,.6);show('res')}
 if(AC&&gain){osc.frequency.setTargetAtTime(55+m.rpm*180+m.g*5,AC.currentTime,.05);gain.gain.setTargetAtTime(S.snd?.04+.05*t:0,AC.currentTime,.08)}
}
const GM=[0,50,70,90,105,120],AG=[0,24,19,15,11,9];
function syncRem(dt){
 ids().forEach((k,i)=>{if(k===uid)return;const p=pos[k];if(!p)return;let r=rem[k];
  if(!r){r=rem[k]={g:mkCar(+players[k].car||0,COL[i%12]),x:p.x,z:p.z,h:p.h,y:0};sc.add(r.g)}
  const f=Math.min(1,dt*10);r.x+=(p.x-r.x)*f;r.z+=(p.z-r.z)*f;r.h+=Math.atan2(Math.sin(p.h-r.h),Math.cos(p.h-r.h))*f;r.y+=((p.y||0)-r.y)*f;r.g.position.set(r.x,r.y,r.z);r.g.rotation.y=r.h});
 for(const k in rem)if(!pos[k]||!players[k]){sc.remove(rem[k].g);delete rem[k]}}
function board(){const a=[{k:uid,n:players[uid]?players[uid].name:'You',p:me.p,f:me.fin,c:ids().indexOf(uid)}];
 ids().forEach((k,i)=>{if(k!==uid&&pos[k])a.push({k,n:players[k].name,p:pos[k].p,f:pos[k].f,c:i})});
 return a.sort((x,y)=>x.f&&y.f?x.f-y.f:x.f?-1:y.f?1:y.p-x.p)}
let sendT=0,resT=0;
function tick(dt,tt){
 if(phase==='count'){const r=(meta.startAt-now())/1000;if(r<=0){phase='race';$('cd').textContent='GO!';setTimeout(()=>$('cd').textContent='',900);beep(880,.5)}else{const c=Math.ceil(r);if(c<=3&&c!==cdv){cdv=c;$('cd').textContent=c;beep(440,.15)}}}
 if(phase==='race')drive(dt);
 const m=me;mine.position.set(m.x,m.y,m.z);mine.rotation.y=m.h;syncRem(dt);
 const fx=Math.sin(m.h),fz=Math.cos(m.h),k=Math.min(1,dt*6);
 cam.position.x+=(m.x-fx*8.5-cam.position.x)*k;cam.position.z+=(m.z-fz*8.5-cam.position.z)*k;cam.position.y+=(4.3+m.y*.6-cam.position.y)*k;
 cam.lookAt(m.x+fx*8,1.4,m.z+fz*8);cam.fov=62+Math.min(18,Math.abs(m.v)/14);cam.updateProjectionMatrix();
 if(tt-sendT>100){sendT=tt;myPos.set({x:+m.x.toFixed(2),z:+m.z.toFixed(2),h:+m.h.toFixed(3),v:Math.round(m.v),p:m.p,f:m.fin||0,y:+m.y.toFixed(2)}).catch(()=>{})}
 const b=board();$('kmh').textContent=Math.abs(m.v)|0;$('gr').textContent=(m.v<-1?'R':'Gear '+m.g)+(S.auto?' (auto)':' (manual)');$('rp').style.width=m.rpm*100+'%';
 $('info').innerHTML=`Lap <b>${cl(m.l,1,LAPS)}/${LAPS}</b><br>Position <b>${b.findIndex(r=>r.k===uid)+1}/${b.length}</b>`;
 const x=$('mm').getContext('2d');x.clearRect(0,0,150,150);x.drawImage(mmBg,0,0);
 b.forEach(r=>{const o=r.k===uid?m:rem[r.k];if(!o)return;const[a,c]=mmT(o.x,o.z);x.beginPath();x.arc(a,c,r.k===uid?5.5:4,0,6.3);x.fillStyle=hx(COL[r.c%12]);x.fill();if(r.k===uid){x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}});
 if(m.fin&&tt-resT>500){resT=tt;$('rl').innerHTML=b.map((r,i)=>`<div class="row"><b>${i+1}</b><i style="background:${hx(COL[r.c%12])}"></i>${esc(r.n)}${r.k===uid?' (you)':''}<span>${r.f?r.f.toFixed(2)+' s':'racing...'}</span></div>`).join('');$('nx').style.display=isHost?'':'none'}
}
let last=0;
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000||0,.05);last=t;if(me&&mine&&(phase==='count'||phase==='race')){tick(dt,t);R.render(sc,cam)}})(0);
</script></body></html>
